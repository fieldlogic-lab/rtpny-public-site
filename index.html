<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rising Tide New York</title><style>:root{--ink:#132027;--muted:#68747a;--paper:#f5f3ee;--white:#fff;--red:#79001a;--gold:#aa8138;--line:#ddd9d0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}.bar{max-width:1160px;margin:auto;padding:18px 24px;display:flex;align-items:center;gap:28px}.brand{font:700 20px Georgia,serif;color:var(--ink);text-decoration:none}.nav{display:flex;gap:22px;margin-left:auto}.nav a{color:var(--ink);text-decoration:none;font-size:14px}.nav a.active{color:var(--red);font-weight:800}.app{background:var(--red);color:#fff!important;border-radius:999px;padding:9px 14px}.wrap{max-width:1160px;margin:auto;padding:34px 24px 70px}.hero{padding:38px 0 34px;max-width:920px}.ey{font-size:11px;color:var(--gold);letter-spacing:.16em;text-transform:uppercase;font-weight:800}.hero h1{font:800 clamp(48px,8vw,88px)/.94 Georgia,serif;letter-spacing:-.06em;margin:13px 0 20px}.hero p{font-size:19px;color:var(--muted);max-width:700px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);padding:24px;border-radius:14px}.card h2{font:700 28px Georgia,serif;margin:8px 0}.card h3{margin:7px 0 5px;font-size:18px}.card p{color:var(--muted)}.card a,.back{color:var(--red);font-weight:800;text-decoration:none}.pagehead{border-bottom:1px solid var(--line);padding:24px 0;margin-bottom:24px}.pagehead h1{font:700 52px/1 Georgia,serif;margin:10px 0}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px 19px}.item strong{display:block;font-size:17px}.item span{color:var(--muted);font-size:14px}.notice{border-left:4px solid var(--gold);padding:13px 16px;background:#fff;margin:18px 0}.footer{border-top:1px solid var(--line);padding:24px;color:var(--muted);font-size:13px}@media(max-width:760px){.bar{padding:15px 16px}.nav{gap:11px}.nav a:not(.app){display:none}.wrap{padding:20px 16px 55px}.hero{padding:24px 0}.hero h1{font-size:56px}.grid,.twocol{grid-template-columns:1fr}.pagehead h1{font-size:42px}}
</style></head><body><header><div class="bar"><a class="brand" href="#home">Rising Tide New York</a><nav class="nav"><a href="#athletes">Athletes</a><a href="#parents">Parents</a><a href="#regattas">Regattas</a><a href="#about">About</a><a class="app" href="https://crew.rtpny.com">Coach App ↗</a></nav></div></header><main class="wrap" id="app"></main><footer class="footer"><div class="bar" style="padding:0"><span>Rising Tide Productions NY · Stony Brook Crew</span><span style="margin-left:auto">Practical information, clearly shared.</span></div></footer><script>
const pages={home:{ey:'Stony Brook University Club Rowing',title:'A stronger tide behind the team.',intro:'A clear home for new rowers, athletes, families, and everyone who helps Stony Brook Crew move forward.',body:`<div class="grid"><article class="card"><div class="ey">Start here</div><h2>New rowers</h2><p>What the first days feel like, what to bring, how practice works, and how to learn the language of rowing.</p><a href="#athletes">New-rower guide →</a></article><article class="card"><div class="ey">Plan ahead</div><h2>Parents</h2><p>Understand the season, regattas, travel, equipment, costs, and the best ways to support the team.</p><a href="#parents">Parent guide →</a></article><article class="card"><div class="ey">The season</div><h2>Regattas</h2><p>Schedules, arrival, transportation, race-day preparation, clothing, food, equipment, and family logistics.</p><a href="#regattas">Regatta hub →</a></article></div><div class="notice"><b>Current information:</b> Schedule and event details will be posted when confirmed. Historical examples are not presented as current requirements.</div>`},athletes:{ey:'For athletes and new rowers',title:'Learn the boat. Learn the team.',intro:'The first weeks are about safety, sequence, rhythm, and building trust—one repeatable stroke at a time.',body:`<div class="twocol"><div class="list"><div class="item"><strong>First Week Guide</strong><span>Practice times, preparation, team commands, expectations, and what to bring.</span></div><div class="item"><strong>Practice rhythm</strong><span>Technical instruction, land training, water introduction, and progressive conditioning.</span></div><div class="item"><strong>Race-day preparation</strong><span>Arrive prepared, protect equipment, warm up deliberately, and stay together.</span></div></div><div class="card"><div class="ey">Coaching reference</div><h2>Build the basics first.</h2><p>Sequence, posture, hands away, body over, patient slide, connected legs, and quiet recovery are the foundation for everything that follows.</p><a href="https://crew.rtpny.com">Open Coach App ↗</a></div></div>`},parents:{ey:'For families',title:'Know what the season asks.',intro:'A practical guide to helping an athlete arrive ready, travel well, and feel supported through the season.',body:`<div class="grid"><article class="card"><h3>What to expect</h3><p>Practice, equipment care, communication, attendance, safety, and the gradual move from land training to water work.</p></article><article class="card"><h3>Costs and forms</h3><p>Current costs, deadlines, waivers, and forms will be posted when confirmed. Please do not rely on historical documents for current amounts.</p></article><article class="card"><h3>How parents help</h3><p>Support preparation, reinforce communication, respect the team’s working space, and help athletes own their equipment and commitments.</p></article></div>`},regattas:{ey:'Season logistics',title:'Regatta hub.',intro:'A consistent place for schedules, travel, arrival, racing, equipment, food, conduct, and family-facing guidance.',body:`<div class="list"><div class="item"><strong>Upcoming regattas</strong><span>Current dates, venues, race times, and travel details will appear here after confirmation.</span></div><div class="item"><strong>Head of the Fish</strong><span>Race-day guide, arrival plan, equipment checklist, clothing, food, and spectator information.</span></div><div class="item"><strong>Frostbite & Braxton</strong><span>Race weekend planning, transportation, packing, and family logistics.</span></div><div class="item"><strong>Past regattas</strong><span>Historical race guides inform planning structure but are clearly labeled as archival.</span></div></div>`},about:{ey:'About the program',title:'People, projects, possibilities.',intro:'Stony Brook Crew is a community built through discipline, shared work, and the belief that people rise when the structure around them is clear.',body:`<div class="twocol"><div class="card"><h2>Program</h2><p>Learn about the team, coaching, leadership, alumni, recruiting, and ways to support the program.</p></div><div class="card"><h2>Contact</h2><p>Program contact details and recruiting information will be posted here when confirmed.</p></div></div>`}};
function render(){let key=location.hash.slice(1)||'home',p=pages[key]||pages.home;document.getElementById('app').innerHTML=`<section class="pagehead"><div class="ey">${p.ey}</div><h1>${p.title}</h1><p>${p.intro}</p></section>${p.body}`;document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+key));window.scrollTo(0,0)}addEventListener('hashchange',render);render();
</script></body></html>
