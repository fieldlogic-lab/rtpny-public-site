<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#79001a"><title>Rising Tide New York · Stony Brook Crew</title><style>
:root{--navy:#061f3b;--red:#8f0018;--red2:#d7192a;--yellow:#f7b719;--ice:#e7eef2;--ink:#071d35;--paper:#f2f3f3;--white:#fff;--line:#cbd3d9}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Arial,Helvetica,sans-serif}header{background:var(--red);color:#fff;position:sticky;top:0;z-index:4}.bar{max-width:1240px;margin:auto;padding:20px 32px;display:flex;align-items:center;gap:22px}.brand{color:#fff;text-decoration:none;display:flex;align-items:center;gap:12px;text-transform:uppercase;font-weight:900;letter-spacing:.08em;line-height:1}.mark{width:44px;height:44px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:13px;background:#fff;color:var(--navy)}.brand small{display:block;color:#fff;font-size:10px;letter-spacing:.22em;margin-top:5px}.nav{display:flex;gap:28px;margin-left:auto;align-items:center}.nav a{color:#fff;text-decoration:none;text-transform:uppercase;font-size:12px;font-weight:900;letter-spacing:.1em}.nav a.active{color:var(--yellow)}.app{background:#fff;color:var(--red)!important;padding:12px 15px}.wrap{max-width:1240px;margin:auto} .hero{background:linear-gradient(90deg,rgba(143,0,24,.96),rgba(215,25,42,.76)),url('https://images.pexels.com/photos/37992785/pexels-photo-37992785.jpeg?auto=compress&cs=tinysrgb&w=1800') center/cover;color:#fff;padding:118px 32px 96px;min-height:520px;display:grid;grid-template-columns:1.25fr .75fr;gap:72px;align-items:end;position:relative;overflow:hidden}.hero:after{content:'SBU CREW';position:absolute;right:-30px;bottom:-50px;color:#ffffff18;font-size:150px;font-weight:900;letter-spacing:-.09em}.hero h1,.page h1{font-size:clamp(56px,9vw,126px);line-height:.86;letter-spacing:-.08em;margin:16px 0 24px;max-width:760px;position:relative;z-index:1}.hero p,.page>p{font-size:20px;max-width:580px;position:relative;z-index:1}.ey{color:var(--yellow);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:900}.hero .cta{display:inline-block;background:#fff;color:var(--red);padding:15px 18px;text-decoration:none;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;margin-top:18px}.band{padding:85px 32px;background:var(--navy);color:#fff}.band.yellow{background:var(--yellow);color:var(--navy)}.band.ice{background:var(--ice);color:var(--ink)}.bandhead{display:flex;justify-content:space-between;align-items:end;gap:28px;margin-bottom:34px}.band h2{font-size:clamp(44px,6vw,80px);line-height:.9;letter-spacing:-.07em;margin:10px 0 0}.bandhead p{max-width:390px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0}.card{background:#0c3159;color:#fff;border:1px solid #46617a;padding:25px;min-height:270px;display:flex;flex-direction:column}.yellow .card{background:transparent;color:var(--navy);border-color:#d69b0c}.ice .card{background:#fff;color:var(--ink);border-color:var(--line)}.card h2{font-size:28px;line-height:1.05;margin:24px 0 10px;letter-spacing:-.04em}.card h3{font-size:20px;margin:8px 0}.card p{opacity:.84}.card a,.back{color:inherit;font-weight:900;text-decoration:none;text-transform:uppercase;font-size:11px;letter-spacing:.1em;margin-top:auto}.page{padding:80px 32px 95px}.pagehead{max-width:980px;border-bottom:3px solid var(--navy);padding-bottom:34px;margin-bottom:30px}.pagehead h1{font-size:clamp(58px,8vw,110px);margin:12px 0}.pagehead p{max-width:700px;color:#405469}.list{display:grid;gap:10px;max-width:900px}.item{background:#fff;border-left:7px solid var(--red);padding:20px 22px}.item strong{display:block;font-size:20px}.item span{color:#516273}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}.notice{border-left:7px solid var(--yellow);background:#fff;padding:17px 20px;margin:22px 0}.footer{background:var(--navy);color:#fff;padding:28px 32px;font-size:13px}.footer .bar{padding:0}@media(max-width:800px){.bar{padding:16px}.nav{gap:13px}.nav a:not(.app){display:none}.hero{grid-template-columns:1fr;min-height:auto;padding:80px 20px 70px;gap:20px}.band,.page{padding:56px 20px}.bandhead{display:block}.grid,.twocol{grid-template-columns:1fr}.card{min-height:210px}.hero h1,.page h1{font-size:62px}.footer .bar{display:block}.footer span+span{display:block;margin-top:12px!important}}

const pages={home:{ey:'Stony Brook University Club Rowing',title:'A stronger tide behind the team.',intro:'A clear home for new rowers, athletes, families, and everyone who helps Stony Brook Crew move forward.',body:`<div class="grid"><article class="card"><div class="ey">Start here</div><h2>New rowers</h2><p>What the first days feel like, what to bring, how practice works, and how to learn the language of rowing.</p><a href="#athletes">New-rower guide →</a></article><article class="card"><div class="ey">Plan ahead</div><h2>Parents</h2><p>Understand the season, regattas, travel, equipment, costs, and the best ways to support the team.</p><a href="#parents">Parent guide →</a></article><article class="card"><div class="ey">The season</div><h2>Regattas</h2><p>Schedules, arrival, transportation, race-day preparation, clothing, food, equipment, and family logistics.</p><a href="#regattas">Regatta hub →</a></article></div><div class="notice"><b>Current information:</b> Schedule, costs, deadlines, and travel details appear only after confirmation.</div>`},athletes:{ey:'For athletes and new rowers',title:'Learn the boat. Learn the team.',intro:'The first weeks are about safety, sequence, rhythm, and building trust—one repeatable stroke at a time.',body:`<div class="grid"><article class="card"><h3>First Week Guide</h3><p>Practice preparation, team commands, expectations, and what to bring.</p><a href="#coaching">See coaching resources →</a></article><article class="card"><h3>Training progression</h3><p>Technical instruction, land training, water introduction, and progressive conditioning.</p><a href="#schedule">View season schedule →</a></article><article class="card"><h3>Safety and equipment</h3><p>Carry together, listen first, protect the fleet, and leave equipment ready for the next crew.</p><a href="#safety">Read safety guide →</a></article></div>`},parents:{ey:'For families',title:'Know what the season asks.',intro:'A practical guide to helping an athlete arrive ready, travel well, and feel supported through the season.',body:`<div class="grid"><article class="card"><h3>What to expect</h3><p>Practice, equipment care, communication, attendance, safety, and the move from land training to water work.</p></article><article class="card"><h3>Costs and forms</h3><p>Current costs, deadlines, waivers, and forms will be posted when confirmed. Historical documents are not current requirements.</p></article><article class="card"><h3>How parents help</h3><p>Support preparation, reinforce communication, respect the team’s working space, and help athletes own their commitments.</p></article></div><div class="notice">Regatta-day family information will be posted with each confirmed event.</div>`},regattas:{ey:'Season logistics',title:'Regatta hub.',intro:'A consistent place for schedules, travel, arrival, racing, equipment, food, conduct, and family-facing guidance.',body:`<div class="list"><div class="item"><strong>Upcoming regattas</strong><span>Current dates, venues, race times, and travel details will appear after confirmation.</span></div><div class="item"><strong>Head of the Fish</strong><span>Race-day guide, arrival plan, equipment checklist, clothing, food, and spectator information.</span></div><div class="item"><strong>Frostbite & Braxton</strong><span>Race weekend planning, transportation, packing, and family logistics.</span></div><div class="item"><strong>Past regattas</strong><span>Historical race guides inform planning structure and are labeled archival.</span></div></div><div class="notice"><a class="back" href="#travel">Travel and packing framework →</a></div>`},about:{ey:'About the program',title:'People, projects, possibilities.',intro:'Stony Brook Crew is a community built through discipline, shared work, and the belief that people rise when the structure around them is clear.',body:`<div class="grid"><article class="card"><h3>Program and coaching</h3><p>Learn how the team trains, teaches, races, and grows.</p><a href="#coaching">Coaching resources →</a></article><article class="card"><h3>Leadership and alumni</h3><p>Team leadership, alumni connection, and ways to support the program.</p><a href="#leadership">Program community →</a></article><article class="card"><h3>Recruiting</h3><p>What prospective athletes should know before reaching out.</p><a href="#recruiting">Recruiting information →</a></article></div>`},coaching:{ey:'Coaching resources',title:'Practical rowing knowledge.',intro:'Concise reference pages shaped by the team archive: useful enough to prepare, focused enough to use.',body:`<div class="grid"><article class="card"><h3>Novice curriculum</h3><p>Sequence, posture, recovery order, connection, commands, and the first water progression.</p></article><article class="card"><h3>Technical drills</h3><p>Body-over pause, reverse pick, legs-only to full stroke, square blade, and rate ladders.</p></article><article class="card"><h3>Erg and benchmarks</h3><p>Training context for 2K and 6K work, with results and current standards kept coach-facing.</p></article><article class="card"><h3>Strength and conditioning</h3><p>Simple supporting work that complements rowing without replacing technical quality.</p></article><article class="card"><h3>Coxswain development</h3><p>Commands, safety, awareness, communication, and race-day responsibility.</p></article><article class="card"><h3>Coaching philosophy</h3><p>Clear standards, progressive challenge, shared ownership, and purposeful practice.</p></article></div>`},safety:{ey:'Athlete readiness',title:'Safety and equipment.',intro:'Safety is a team skill: listen, acknowledge, move together, and leave the fleet better than you found it.',body:`<div class="twocol"><div class="card"><h2>Before practice</h2><p>Arrive prepared, check conditions, dress for the weather, and ask when something is unclear.</p></div><div class="card"><h2>With equipment</h2><p>Carry shells together, protect riggers and oars, use correct hardware, and complete the reset before leaving.</p></div></div>`},travel:{ey:'Regatta planning',title:'Travel and packing.',intro:'Each event page will provide confirmed details when available. This is the planning framework, not a substitute for the event itinerary.',body:`<div class="grid"><article class="card"><h3>Bring</h3><p>Team clothing, weather layers, water, food plan, medications, identification, and any event-specific items.</p></article><article class="card"><h3>Team equipment</h3><p>Shells, oars, riggers, cox boxes, tools, bow numbers, slings, first aid, lights, paperwork, and tie-downs.</p></article><article class="card"><h3>Family logistics</h3><p>Venue, arrival, parking, spectator access, food, and timing will be posted per confirmed regatta.</p></article></div>`},schedule:{ey:'Current season',title:'Schedule of events.',intro:'The current schedule is maintained from the 2026–27 program source. Dates and details remain subject to confirmation.',body:`<div class="list"><div class="item"><strong>Fall 2026</strong><span>Training, water introduction, head racing, and championship preparation.</span></div><div class="item"><strong>Winter and spring</strong><span>Details will be posted when confirmed.</span></div></div><div class="notice">Historical calendars are used for context only and are not displayed as current commitments.</div>`},leadership:{ey:'Program community',title:'Leadership, alumni, support.',intro:'A strong program is carried by athletes, coaches, families, alumni, and supporters who keep showing up.',body:`<div class="grid"><article class="card"><h3>Team leadership</h3><p>Roles and responsibilities will be published when the current season’s structure is confirmed.</p></article><article class="card"><h3>Alumni</h3><p>Reconnect with the team, share experience, and help current athletes see the larger tradition.</p></article><article class="card"><h3>Support the program</h3><p>Details for supporting the team will be posted when confirmed.</p></article></div>`},recruiting:{ey:'Prospective athletes',title:'Find your place in the boat.',intro:'Rowing rewards curiosity, consistency, and the willingness to learn. Prior rowing experience is not the only way to begin.',body:`<div class="twocol"><div class="card"><h2>What matters</h2><p>Show up, learn the sequence, care for teammates and equipment, and keep building.</p></div><div class="card"><h2>Start a conversation</h2><p>Current recruiting contact information will be posted when confirmed.</p></div></div>`}};
function render(){let k=location.hash.slice(1)||'home',p=pages[k]||pages.home;document.getElementById('app').innerHTML=`<section class="pagehead"><div class="ey">${p.ey}</div><h1>${p.title}</h1><p>${p.intro}</p></section>${p.body}`;document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+k));scrollTo(0,0)}addEventListener('hashchange',render);render();
</script></body></html>
